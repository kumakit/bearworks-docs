site_name: Data Science Docs

nav:
  - ホーム: index.md
  - 統計学:
      - 統計検定2級・学習まとめ: statistics_l2.md
      - 記述統計:
          - 1変数記述統計: univariate-descriptive-statistics.md
          - 2変数記述統計: bivariate-descriptive-statistics.md
      - 分析の落とし穴:
          - 切断効果: truncation-effect.md
          - シンプソンのパラドックス: simpsons-paradox.md
  - データサイエンス:
      - 統計検定DS発展・勉強メモ: ds_dev.md
  - 実務への応用:
      - 独立と排反（問い合わせ・障害分析）: independence-mutual-exclusivity-in-operations.md
  - Bearworks Hub: https://bearworks.uk/

theme:
  name: material
  custom_dir: overrides
  icon:
    logo: material/database
  language: 'ja'
  font: 
    text: Inter
    code: Fira Code
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: blue
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: blue
  extra:
    search:
      language: 'jp'

extra:
  homepage: https://bearworks.uk/

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true
      ##clickable_checkbox: true
  - def_list
  - pymdownx.arithmatex:
      generic: true
  - attr_list
  - md_in_html

  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  
extra_javascript:
  - javascripts/katex.js 
  - https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.7/katex.min.js  
  - https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.7/contrib/auto-render.min.js

extra_css:
  - stylesheets/custom.css
  - https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.7/katex.min.css
  - stylesheets/extra.css
