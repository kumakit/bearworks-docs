<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
<title id="title">3×3のフィルターが5×5の画像を移動してエッジを探す</title>
<desc id="desc">5×5の入力は各行が0,0,1,1,0。3×3のフィルターは各行が-1,0,1。フィルターとの積和を3×3の位置で計算すると、各行3,3,-3という特徴マップを得る。最初の出力3は3行の(0×-1+0×0+1×1)の合計。実際の学習フィルターではなく手作りの説明用。</desc>
<rect width="1100" height="520" rx="18" fill="#fff"/>
<text x="46" y="53" font-size="29" font-weight="bold" fill="#0f172a" font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif">小さなフィルターを、画像の上で滑らせる</text>
<text x="46" y="86" font-size="17" fill="#475569" font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif">図は単純化した固定フィルター。実際のCNNはフィルターの値を学習する。</text>
<text x="63" y="138" font-size="23" font-weight="bold" fill="#1e293b" font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif">入力画像 5×5</text>
