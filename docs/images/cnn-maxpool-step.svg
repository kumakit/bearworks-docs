<svg xmlns="http://www.w3.org/2000/svg" width="960" height="488" viewBox="0 0 960 488" role="img" aria-labelledby="title desc">
<title id="title">MaxPoolingは2×2のまとまりから最大値だけを残す</title>
<desc id="desc">入力4×4行列は1 3 0 2、2 1 5 1、0 4 2 2、1 0 3 6。2×2の最大値を取ると結果は3 5、4 6。プーリングは特徴の位置ずれにある程度強くなり、計算量を減らす。</desc>
<rect width="960" height="488" rx="16" fill="#fff"/>
<text x="40" y="54" font-size="28" font-weight="bold" fill="#0f172a" font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif">MaxPooling：４個から「最大の１個」を残す</text>
<text x="40" y="89" font-size="17" fill="#475569" font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif">2×2の領域を１つに縮め、位置が少し変わっても強い反応を残しやすくする。</text>
<text x="100" y="147" font-size="23" fill="#1e293b" font-weight="bold" font-family="Inter, 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif">元の特徴マップ 4×4</text>
